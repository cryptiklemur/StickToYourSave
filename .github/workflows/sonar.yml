name: sonar

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: game image
    uses: RimWorks/mod-ci/.github/workflows/game-image.yml@v4
    permissions:
      contents: read
      packages: write
    with:
      artifact-prefix: sonar-image-ref
      image: ghcr.io/${{ github.repository_owner }}/rimworld-game
      branches: |
        1.6=public
    secrets: inherit

  analyze:
    name: analyze
    needs: images
    uses: RimWorks/mod-ci/.github/workflows/sonar.yml@v4
    permissions:
      contents: read
      packages: read
    with:
      solution: StickToYourSave.slnx
      project-key: cryptiklemur_StickToYourSave
      organization: cryptiklemur
      game-image: ${{ fromJSON(needs.images.outputs.image-refs)['1.6'] }}
      exclusions: Styles/**,Textures/**,artifacts/**,**/bin/**,**/obj/**
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
