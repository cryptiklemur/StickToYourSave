name: ci

on:
  workflow_call:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  game-image:
    name: game image
    uses: RimWorks/mod-ci/.github/workflows/game-image.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      branch: version-1.6.4633
      include-paths: RimWorldLinux_Data/Managed
    secrets:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}

  build:
    name: build
    needs: game-image
    uses: RimWorks/mod-ci/.github/workflows/dotnet-build.yml@v1
    permissions:
      contents: read
      checks: write
      packages: read
    with:
      solution: Source/StickToYourSave/StickToYourSave.csproj
      game-image: ${{ needs.game-image.outputs.image-ref }}
      # No test project in this mod yet.
      test: false

  prose:
    name: prose
    uses: RimWorks/mod-ci/.github/workflows/prose.yml@v1
    permissions:
      contents: read

  links:
    name: links
    uses: RimWorks/mod-ci/.github/workflows/links.yml@v1
    permissions:
      contents: read
    with:
      args: --config lychee.toml --no-progress README.md README.template.md
