name: ci

on:
  workflow_call:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the game image even when the Steam buildid has not moved.
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  images:
    name: game image
    uses: RimWorks/mod-ci/.github/workflows/game-image.yml@v4
    permissions:
      contents: read
      packages: write
    with:
      artifact-prefix: ci-image-ref
      image: ghcr.io/${{ github.repository_owner }}/rimworld-game
      force: ${{ inputs.force || false }}
      branches: |
        1.6=public
    secrets:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}

  build:
    name: build
    needs: images
    uses: RimWorks/mod-ci/.github/workflows/dotnet-build.yml@v4
    permissions:
      contents: read
      checks: write
      packages: read
    with:
      solution: Source/StickToYourSave/StickToYourSave.csproj
      game-images: ${{ needs.images.outputs.image-refs }}
      # No test project in this mod yet.
      test: false

  prose:
    name: prose
    uses: RimWorks/mod-ci/.github/workflows/prose.yml@v4
    permissions:
      contents: read

  links:
    name: links
    uses: RimWorks/mod-ci/.github/workflows/links.yml@v4
    permissions:
      contents: read
    with:
      args: --config lychee.toml --no-progress README.md README.template.md
